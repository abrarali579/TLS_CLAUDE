<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TIME LINK · Sign in</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #f8fafc, #eef2f7);
    color: #0f172a; padding: 24px;
  }
  .card {
    width: 100%; max-width: 380px; background: #fff; border-radius: 16px; padding: 32px;
    box-shadow: 0 10px 40px rgba(15, 23, 42, .1); border: 1px solid rgba(15, 23, 42, .06);
  }
  h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: .5px; }
  .sub { margin: 0 0 24px; color: #64748b; font-size: 13px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin: 14px 0 6px; }
  input {
    width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 9px;
    font-size: 15px; background: #fff; color: inherit;
  }
  input:focus { outline: 2px solid #2563eb; outline-offset: 1px; border-color: transparent; }
  button {
    width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 9px;
    background: #2563eb; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  button[disabled] { opacity: .6; cursor: default; }
  .err {
    margin-top: 16px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
    background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; display: none;
  }
  .err.on { display: block; }
  .note { margin-top: 20px; font-size: 12px; color: #94a3b8; text-align: center; }
</style>
</head>
<body>
  <form class="card" id="f" autocomplete="on">
    <h1>TIME LINK</h1>
    <p class="sub">Business Suite — sign in to continue</p>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button id="go" type="submit">Sign in</button>
    <div class="err" id="err"></div>
    <p class="note">Office network only</p>
  </form>

<script>
  const f = document.getElementById('f');
  const err = document.getElementById('err');
  const go = document.getElementById('go');

  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.classList.remove('on');
    go.disabled = true;
    go.textContent = 'Signing in…';
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });
      if (r.ok) { location.href = '/'; return; }
      const body = await r.json().catch(() => ({}));
      err.textContent = body.error || 'Could not sign in';
      err.classList.add('on');
    } catch (x) {
      err.textContent = 'Could not reach the server';
      err.classList.add('on');
    }
    go.disabled = false;
    go.textContent = 'Sign in';
  });
</script>
</body>
</html>
