<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TimeLink Database — Phase 1</title>
<style>
:root{
  --teal:#0f766e; --teal-d:#115e59; --teal-l:#14b8a6;
  --row:#e6f4f1; --row-alt:#f4fbfa; --line:#cbd5d1;
  --ink:#111827; --muted:#6b7280; --bg:#f1f5f4;
  --red:#b71c1c; --green:#0f766e; --blue:#1565c0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font-family:inherit;font-size:inherit}

/* ---------- shell ---------- */
#app{display:flex;height:100vh;overflow:hidden}
#side{width:210px;flex:0 0 210px;background:#0b3b38;color:#cbe9e4;display:flex;flex-direction:column}
#side .brand{padding:16px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
#side .brand b{display:block;font-size:15px;color:#fff;letter-spacing:.5px}
#side .brand span{font-size:11px;opacity:.65}
#side nav{padding:8px 0;flex:1;overflow:auto}
#side nav a{display:flex;align-items:center;gap:9px;padding:10px 16px;color:#cbe9e4;text-decoration:none;font-size:13.5px;cursor:pointer;border-left:3px solid transparent}
#side nav a:hover{background:rgba(255,255,255,.06)}
#side nav a.on{background:rgba(255,255,255,.12);color:#fff;border-left-color:var(--teal-l);font-weight:600}
#side .foot{padding:10px 14px;font-size:11px;opacity:.5;border-top:1px solid rgba(255,255,255,.1)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:9px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.4px;flex:0 0 auto}
.spacer{flex:1}
.view{flex:1;overflow:auto;padding:14px 16px}
.hidden{display:none!important}

/* ---------- buttons / inputs ---------- */
.btn{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;color:#374151;white-space:nowrap}
.btn:hover{background:#f3f4f6}
.btn.p{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.p:hover{background:var(--teal-d)}
.btn.d{background:#fff;border-color:#fca5a5;color:#b91c1c}
.btn.sm{padding:3px 9px;font-size:12px}
.fld{border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:13px;background:#fff}
label.lb{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:3px}

/* ---------- KPI cards ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi .t{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.kpi .v{font-size:20px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .v.neg{color:var(--red)} .kpi .v.pos{color:var(--teal)}

/* ---------- grid ---------- */
.gridwrap{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:calc(100vh - 250px)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.grid th{position:sticky;top:0;z-index:3;background:#fff;color:#0b3b38;font-weight:800;font-size:12px;letter-spacing:.7px;
  text-transform:uppercase;padding:11px 8px;border-bottom:2px solid #0b3b38;border-right:1px solid var(--line);white-space:nowrap}
table.grid th.rownum{background:var(--teal);color:#fff;width:44px;text-align:center;border-bottom-color:var(--teal-d)}
table.grid td{padding:0;border-bottom:1px solid #dde8e5;border-right:1px solid #e6eeec;background:var(--row);height:34px}
table.grid tr:nth-child(even) td{background:var(--row-alt)}
table.grid tr:hover td{background:#d7ece7}
td.rownum{background:#f8fafa!important;color:var(--muted);text-align:center;font-size:11.5px;width:44px;font-variant-numeric:tabular-nums}
td.num .cell{text-align:center;font-variant-numeric:tabular-nums}
.cell{width:100%;height:100%;border:0;background:transparent;padding:6px 8px;font-size:13px;color:var(--ink);outline:none;display:block}
.cell:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--teal-l)}
td.profit .cell{font-weight:700}
td.profit.neg .cell{color:var(--red)}
.pf{width:100%;height:100%;border:0;padding:6px 8px;font-size:12.5px;font-weight:800;letter-spacing:.4px;text-align:center;
  color:#fff;cursor:pointer;outline:none;appearance:none;-webkit-appearance:none}
.pf.empty{background:transparent;color:var(--muted);font-weight:500}
td.act{width:34px;text-align:center}
.del{border:0;background:transparent;color:#b91c1c;cursor:pointer;font-size:15px;opacity:.35;line-height:1}
tr:hover .del{opacity:1}
tfoot td{position:sticky;bottom:0;background:#0b3b38!important;color:#fff;font-weight:800;padding:9px 8px;font-size:13px;text-align:center;border:0}
tfoot td.l{text-align:right;padding-right:14px}

/* datalist-free autocomplete */
.acbox{position:absolute;z-index:60;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.15);max-height:220px;overflow:auto;min-width:220px;display:none}
.acbox div{padding:6px 10px;font-size:13px;cursor:pointer}
.acbox div:hover,.acbox div.sel{background:var(--teal);color:#fff}

/* ---------- statement ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
table.st{border-collapse:collapse;width:100%;font-size:13px;background:#fff}
table.st th{background:#4A5157;color:#fff;padding:9px 8px;font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;border:1px solid #dee2e6}
table.st td{padding:7px 8px;border:1px solid #dee2e6}
table.st td.c{text-align:center;font-variant-numeric:tabular-nums}
table.st tr.pay td{background:#E8F8F5}
table.st tr.tot td{background:#2B3035;color:#fff;font-weight:800}
table.st tr.open td{background:#FFF2CC;font-weight:700}
.badge{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:800}
.badge.bal{background:#fee2e2;color:#991b1b}
.badge.adv{background:#d1fae5;color:#065f46}

/* ---------- misc tables ---------- */
table.list{border-collapse:collapse;width:100%;font-size:13px;background:#fff}
table.list th{background:#0b3b38;color:#fff;padding:9px 8px;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0}
table.list td{padding:7px 8px;border-bottom:1px solid #e5e7eb}
table.list tr:hover td{background:#f0fdfa}
.pill{display:inline-block;width:16px;height:16px;border-radius:4px;background:#e5e7eb}
.pill.on{background:var(--teal)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0b3b38;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.hint{font-size:12px;color:var(--muted)}
@media print{#side,.topbar,.noprint{display:none!important}.view{padding:0;overflow:visible}#app{display:block;height:auto}}
</style>
</head>

</div>

  r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function kvGet(k){const db=await idb();return new Promise(r=>{const q=db.transaction(STORE).objectStore(STORE).get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(undefined);});}
async function kvSet(k,v){const db=await idb();return new Promise(r=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(v,k);t.oncomplete=()=>r();});}

let saveTimer=null;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>kvSet('data',D),400);}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;};
const n=v=>{if(v===''||v==null)return 0;const x=Number(String(v).replace(/,/g,'').trim());return isNaN(x)?0:x;};
const money=v=>{const x=Math.round(n(v));return x.toLocaleString('en-US');};
const money2=v=>n(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function fmtDate(iso){if(!iso)return '';const [y,m,d]=iso.split('-');if(!d)return iso;
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${+d} ${M[+m-1]} ${y}`;}
function today(){return new Date().toISOString().slice(0,10);}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1900);}
function colorFor(label){const o=(D.settings.paidFromOptions||[]).find(x=>x.label===label);return o||null;}

/* ---------- autocomplete ---------- */
let acTarget=null, acItems=[], acIdx=-1;
function acShow(input, list){
  acTarget=input; const q=input.value.trim().toUpperCase();
  acItems=list.filter(x=>x&&x.toUpperCase().includes(q)).slice(0,40);
  const box=$('#ac');
  if(!acItems.length||!document.body.contains(input)){acHide();return;}
  box.innerHTML=''; acIdx=-1;
  acItems.forEach((x,i)=>{const d=el('div',null,x);d.onmousedown=e=>{e.preventDefault();acPick(i);};box.appendChild(d);});
  const r=input.getBoundingClientRect();
  box.style.left=r.left+'px'; box.style.top=(r.bottom+2)+'px'; box.style.minWidth=Math.max(r.width,220)+'px';
  box.style.display='block';
}
function acHide(){$('#ac').style.display='none';acTarget=null;acItems=[];acIdx=-1;}
function acPick(i){if(!acTarget||!acItems[i])return;acTarget.value=acItems[i];acTarget.dispatchEvent(new Event('input',{bubbles:true}));acTarget.dispatchEvent(new Event('change',{bubbles:true}));acHide();}
function acNav(d){if(!acItems.length)return;acIdx=(acIdx+d+acItems.length)%acItems.length;
  [...$('#ac').children].forEach((c,i)=>c.classList.toggle('sel',i===acIdx));
  $('#ac').children[acIdx].scrollIntoView({block:'nearest'});}
document.addEventListener('scroll',acHide,true);
window.addEventListener('resize',acHide);

function renderEntry(){

  $('#eclr').onclick=()=>{entryFilter={from:'',to:'',q:''};renderEntry();};

  const rows=filteredTx();

function filteredTx(){
  let r=D.transactions.slice();
  if(entryFilter.from) r=r.filter(x=>x.date>=entryFilter.from);
  if(entryFilter.to)   r=r.filter(x=>x.date<=entryFilter.to);
  if(entryFilter.q){const q=entryFilter.q.toUpperCase();
    r=r.filter(x=>(x.company+' '+x.employee+' '+x.work+' '+(x.paidFrom||'')).toUpperCase().includes(q));}
  return r.sort((a,b)=> a.date===b.date ? (a._s||0)-(b._s||0) : a.date.localeCompare(b.date));
}

function txRow(r,idx){
  const tr=el('tr'); tr.dataset.id=r.id;
  tr.append(el('td','rownum',String(idx)));

  const cell=(val,type,key,list)=>{
    const td=el('td',type==='num'?'num':null);
    const inp=el('input','cell'); inp.type = key==='date'?'date':'text'; inp.value=val??'';
    if(type==='num'){inp.inputMode='decimal';}
    inp.addEventListener('input',()=>{
      if(list) acShow(inp,list);
      r[key]= type==='num'? n(inp.value) : inp.value;
      if(key==='received'||key==='expense'){ r.profit=Math.round((n(r.received)-n(r.expense))*100)/100; refreshProfit(tr,r); }
      if(key==='work' && !n(r.expense)){ const rt=D.rates.find(x=>x.item.toUpperCase()===inp.value.trim().toUpperCase());
        if(rt){ const ec=tr.querySelector('[data-k=expense]'); const rc=tr.querySelector('[data-k=received]');
          ec.value=rt.rate; r.expense=rt.rate;
          if(!n(r.received)&&rt.fee){ rc.value=rt.rate+rt.fee; r.received=rt.rate+rt.fee; }
          r.profit=Math.round((n(r.received)-n(r.expense))*100)/100; refreshProfit(tr,r);}}
      save();
    });
    inp.addEventListener('focus',()=>{if(list)acShow(inp,list);});
    inp.addEventListener('blur',()=>setTimeout(acHide,120));
    inp.addEventListener('keydown',ev=>{
      if($('#ac').style.display==='block'){
        if(ev.key==='ArrowDown'){ev.preventDefault();acNav(1);return;}
        if(ev.key==='ArrowUp'){ev.preventDefault();acNav(-1);return;}
        if(ev.key==='Enter'&&acIdx>=0){ev.preventDefault();acPick(acIdx);return;}
        if(ev.key==='Escape'){acHide();return;}
      }
      if(ev.key==='Enter'){ev.preventDefault();
        const all=[...document.querySelectorAll('.gridwrap tbody tr')];
        if(all[all.length-1]===tr) addRow(); else {
          const nx=all[all.indexOf(tr)+1]; if(nx) nx.querySelector('.cell').focus();}
      }
    });
    inp.dataset.k=key;
    td.append(inp); return td;
  };

  tr.append(cell(r.date,'txt','date'));
  tr.append(cell(r.company,'txt','company',D.companies));
  tr.append(cell(r.employee,'txt','employee'));
  tr.append(cell(r.work,'txt','work',D.workItems));
  tr.append(cell(r.received,'num','received'));
  tr.append(cell(r.expense,'num','expense'));

  const pt=el('td','num profit'+(n(r.profit)<0?' neg':''));
  const pi=el('input','cell'); pi.readOnly=true; pi.value=money(r.profit); pi.tabIndex=-1;
  pt.append(pi); tr.append(pt);

  /* paid from */
  const ptd=el('td'); const sel=el('select','pf');
  sel.append(new Option('','',false,false));
  (D.settings.paidFromOptions||[]).forEach(o=>sel.append(new Option(o.label,o.label)));
  if(r.paidFrom && ![...sel.options].some(o=>o.value===r.paidFrom)) sel.append(new Option(r.paidFrom,r.paidFrom));
  sel.value=r.paidFrom||'';
  const paint=()=>{const o=colorFor(sel.value);
    if(o){sel.classList.remove('empty');sel.style.background=o.color;sel.style.color=o.text||'#fff';}
    else{sel.classList.add('empty');sel.style.background='transparent';sel.style.color='';}};
  paint();
  sel.onchange=()=>{r.paidFrom=sel.value;paint();save();};
  ptd.append(sel); tr.append(ptd);

  const at=el('td','act'); const db=el('button','del','×'); db.title='Delete row';
  db.onclick=()=>{if(confirm('Delete this row?')){D.transactions=D.transactions.filter(x=>x.id!==r.id);save();renderEntry();}};
  at.append(db); tr.append(at);
  return tr;
}
function refreshProfit(tr,r){
  const td=tr.children[7]; td.classList.toggle('neg',n(r.profit)<0);
  td.querySelector('.cell').value=money(r.profit);
}
function addRow(silent){
  const last=D.transactions[D.transactions.length-1];
  const r={id:uid(),date:(entryFilter.to||last&&last.date||today()),company:'',employee:'',work:'',
           received:0,expense:0,profit:0,paidFrom:'',_s:Date.now()};
  D.transactions.push(r); save();
  if(!silent){renderEntry();
    const rows=document.querySelectorAll('.gridwrap tbody tr');
    const t=[...rows].find(x=>x.dataset.id===r.id);
    if(t){t.scrollIntoView({block:'center'});t.querySelectorAll('.cell')[1].focus();}}
}

/* =========================================================
   VIEW: STATEMENT  (port of Apps Script generateStatementOnSheet)
   ========================================================= */
let stState={company:'',from:'',to:''};

function companyEntries(company){
  const out=[];
  D.transactions.forEach((t,i)=>{
    if((t.company||'').trim()!==company) return;
    const cost=n(t.received);                   // sheet RECEIVED == what customer owes (COST on statement)
    const work=(t.work||'').trim();
    if(!work && cost===0) return;
    out.push({date:t.date,employee:(t.employee||'COMPANY WORK').trim()||'COMPANY WORK',
              work:work,cost:cost,received:0,seq:i});
  });
  D.payments.forEach((p,i)=>{
    if((p.company||'').trim()!==company) return;
    const rec=n(p.amount); if(!rec) return;
    out.push({date:p.date,employee:'PAYMENT RECEIVED',work:(p.remark||'PAYMENT RECEIVED').trim(),
              cost:0,received:rec,seq:100000+i});
  });
  out.sort((a,b)=> a.date===b.date ? a.seq-b.seq : a.date.localeCompare(b.date));
  return out;
}

function buildStatement(company,from,to){
  const all=companyEntries(company);
  let rows=[], opening=null;
  if(from&&to){
    opening=all.filter(x=>x.date<from).reduce((a,x)=>a+x.received-x.cost,0);
    rows=all.filter(x=>x.date>=from&&x.date<=to);
  } else rows=all;
  let bal = opening===null?0:opening;
  const lines=rows.map(x=>{bal += x.received - x.cost;
    return {...x,balance:Math.round(bal*100)/100};});
  return {opening,lines,
    totalCost:rows.reduce((a,x)=>a+x.cost,0),
    totalRec:rows.reduce((a,x)=>a+x.received,0),
    closing:Math.round(bal*100)/100};
}

function renderStatement(){

  const v=$('#view'); v.innerHTML='';

  ci.addEventListener('input',()=>acShow(ci,withBal));
  ci.addEventListener('focus',()=>acShow(ci,withBal));
  ci.addEventListener('blur',()=>setTimeout(acHide,150));
  ci.addEventListener('keydown',ev=>{
    if($('#ac').style.display==='block'){
      if(ev.key==='ArrowDown'){ev.preventDefault();acNav(1);}
      else if(ev.key==='ArrowUp'){ev.preventDefault();acNav(-1);}
      else if(ev.key==='Enter'&&acIdx>=0){ev.preventDefault();acPick(acIdx);go();}
      else if(ev.key==='Escape')acHide();
    } else if(ev.key==='Enter') go();
  });
  $('#stq').onchange=e=>{const d=+e.target.value;
    if(!d){$('#stf').value='';$('#stt').value='';}
    else{const t=new Date(),s=new Date();s.setDate(t.getDate()-d);
      $('#stf').value=s.toISOString().slice(0,10);$('#stt').value=t.toISOString().slice(0,10);} go();};
  $('#stg').onclick=go; $('#str').onclick=()=>{stState={company:'',from:'',to:''};renderStatement();};
  function go(){stState={company:ci.value.trim(),from:$('#stf').value,to:$('#stt').value};drawStatement();}

  v.append(el('div','',''));
  const out=el('div'); out.id='stout'; v.append(out);
  if(stState.company) drawStatement();
}

function drawStatement(){
  const out=$('#stout'); out.innerHTML='';
  const {company,from,to}=stState;
  if(!company){out.append(el('div','hint','Choose a company to generate its statement.'));return;}
  const s=buildStatement(company,from,to);
  if(!s.lines.length&&s.opening===null){out.append(el('div','card','No transactions found for this company.'));return;}

  const k=el('div','kpis');
  [['Total Cost',money(s.totalCost),''],['Total Received',money(s.totalRec),''],
   ['Closing Balance',money(Math.abs(s.closing)),s.closing<0?'neg':'pos'],
   ['Status',s.closing<0?'BALANCE DUE':'ADVANCE','']].forEach(([t,val,cl])=>{
     const c=el('div','kpi');c.append(el('div','t',t));c.append(el('div','v '+cl,String(val)));k.append(c);});
  out.append(k);

  const card=el('div','card');
  const h=el('div');
  h.innerHTML=`<div style="font-weight:800;font-size:15px">${company}</div>
   <div class="hint">${from&&to?`${fmtDate(from)} → ${fmtDate(to)}`:'Lifetime'} · ${s.lines.length} entries</div>`;
  h.style.marginBottom='10px'; card.append(h);

  const t=el('table','st');
  t.innerHTML=`<thead><tr><th style="width:100px">Date</th><th>Employee</th><th>Work</th>
    <th style="width:90px">Cost</th><th style="width:90px">Received</th>
    <th style="width:100px">Balance</th><th style="width:60px">Type</th></tr></thead>`;
  const tb=el('tbody');
  if(s.opening!==null){
    const tr=el('tr','open');
    tr.innerHTML=`<td class="c">${fmtDate(from)}</td><td>PREVIOUS BALANCE</td><td>OPENING BALANCE</td>
      <td class="c">0</td><td class="c">0</td><td class="c">${money(s.opening)}</td>
      <td class="c"><span class="badge ${s.opening<0?'bal':'adv'}">${s.opening<0?'Bal':'Adv'}</span></td>`;
    tb.append(tr);
  }
  s.lines.forEach(x=>{
    const tr=el('tr',x.received>0?'pay':null);
    tr.innerHTML=`<td class="c">${fmtDate(x.date)}</td><td>${esc(x.employee)}</td><td>${esc(x.work)}</td>
      <td class="c">${x.cost?money(x.cost):''}</td><td class="c">${x.received?money(x.received):''}</td>
      <td class="c">${money(x.balance)}</td>
      <td class="c"><span class="badge ${x.balance<0?'bal':'adv'}">${x.balance<0?'Bal':'Adv'}</span></td>`;
    tb.append(tr);
  });
  const tr=el('tr','tot');
  tr.innerHTML=`<td colspan="3" style="text-align:right">TOTAL:</td><td class="c">${money(s.totalCost)}</td>
    <td class="c">${money(s.totalRec)}</td><td class="c">${money(s.closing)}</td>
    <td class="c">${s.closing<0?'Bal':'Adv'}</td>`;
  tb.append(tr); t.append(tb); card.append(t); out.append(card);
}

   ========================================================= */
function renderPayments(){
  $('#tools').innerHTML='';
  const a=el('button','btn p','+ Add Payment');
  a.onclick=()=>{D.payments.unshift({date:today(),amount:0,company:'',remark:''});save();renderPayments();};
  $('#tools').append(a);
  const v=$('#view');v.innerHTML='';
  const c=el('div','card noprint');
  c.innerHTML=`<div class="row"><div style="flex:1"><label class="lb">Search company</label>
    <input class="fld" id="pq" style="width:100%" placeholder="filter…"></div></div>`;
  v.append(c);
  const out=el('div'); v.append(out);
  const draw=(q='')=>{
    out.innerHTML='';
    const list=D.payments.map((p,i)=>({p,i}))
      .filter(({p})=>!q||(p.company||'').toUpperCase().includes(q.toUpperCase()))
      .sort((a,b)=>b.p.date.localeCompare(a.p.date));
    const total=list.reduce((a,{p})=>a+n(p.amount),0);
    const k=el('div','kpis');
    [['Payments',list.length],['Total Received',money(total)]].forEach(([t,val])=>{
      const cc=el('div','kpi');cc.append(el('div','t',t));cc.append(el('div','v',String(val)));k.append(cc);});
    out.append(k);
    const w=el('div','gridwrap'); const t=el('table','list');
    t.innerHTML='<thead><tr><th style="width:120px">Date</th><th>Company</th><th style="width:120px">Amount</th><th>Remark</th><th style="width:40px"></th></tr></thead>';
    const tb=el('tbody');
    list.slice(0,600).forEach(({p,i})=>{
      const tr=el('tr');
      const mk=(val,key,type)=>{const td=el('td');const inp=el('input','fld');inp.style.width='100%';inp.style.border='0';inp.style.padding='2px 4px';
        inp.type=type==='date'?'date':'text';inp.value=val??'';
        inp.oninput=()=>{p[key]= type==='num'?n(inp.value):inp.value;save();};
        if(key==='company'){inp.addEventListener('input',()=>acShow(inp,D.companies));inp.addEventListener('blur',()=>setTimeout(acHide,150));}
        td.append(inp);return td;};
      tr.append(mk(p.date,'date','date'),mk(p.company,'company'),mk(p.amount,'amount','num'),mk(p.remark,'remark'));
      const at=el('td');const d=el('button','del','×');
      d.onclick=()=>{if(confirm('Delete payment?')){D.payments.splice(D.payments.indexOf(p),1);save();draw(q);}};
      at.append(d);tr.append(at);tb.append(tr);
    });
    t.append(tb);w.append(t);out.append(w);
    if(list.length>600) out.append(el('div','hint',`Showing first 600 of ${list.length}. Use search to narrow.`));
  };
  let qt;$('#pq').oninput=e=>{clearTimeout(qt);const val=e.target.value;qt=setTimeout(()=>draw(val),250);};
  draw();
}

/* =========================================================
   VIEW: COMPANIES (balance overview)
   ========================================================= */
function renderCompanies(){
  $('#tools').innerHTML='';
  const v=$('#view');v.innerHTML='';
  const names=[...new Set([...D.transactions.map(t=>t.company),...D.payments.map(p=>p.company)])].filter(Boolean);
  const data=names.map(c=>{const s=buildStatement(c,'','');
    return {company:c,cost:s.totalCost,received:s.totalRec,balance:s.closing};})
    .sort((a,b)=>a.balance-b.balance);
  const due=data.filter(x=>x.balance<0), adv=data.filter(x=>x.balance>0);
  const k=el('div','kpis');
  [['Companies',data.length,''],['Total Receivable',money(due.reduce((a,x)=>a-x.balance,0)),'neg'],
   ['Total Advance',money(adv.reduce((a,x)=>a+x.balance,0)),'pos']].forEach(([t,val,cl])=>{
    const c=el('div','kpi');c.append(el('div','t',t));c.append(el('div','v '+cl,String(val)));k.append(c);});
  v.append(k);
  const c=el('div','card noprint');
  c.innerHTML='<input class="fld" id="cq" style="width:100%" placeholder="Search company…">';
  v.append(c);
  const out=el('div');v.append(out);
  const draw=(q='')=>{
    out.innerHTML='';
    const w=el('div','gridwrap');const t=el('table','list');
    t.innerHTML='<thead><tr><th>Company</th><th style="width:110px">Total Cost</th><th style="width:110px">Received</th><th style="width:110px">Balance</th><th style="width:90px">Status</th><th style="width:100px"></th></tr></thead>';
    const tb=el('tbody');
    data.filter(x=>!q||x.company.toUpperCase().includes(q.toUpperCase())).forEach(x=>{
      const tr=el('tr');
      tr.innerHTML=`<td><b>${esc(x.company)}</b></td><td>${money(x.cost)}</td><td>${money(x.received)}</td>
        <td style="font-weight:700;color:${x.balance<0?'#b71c1c':'#0f766e'}">${money(x.balance)}</td>
        <td><span class="badge ${x.balance<0?'bal':'adv'}">${x.balance<0?'Bal':'Adv'}</span></td><td></td>`;
      const b=el('button','btn sm','Statement');
      b.onclick=()=>{stState={company:x.company,from:'',to:''};switchView('statement');};
      tr.lastChild.append(b); tb.append(tr);
    });
    t.append(tb);w.append(t);out.append(w);
  };
  let qt;$('#cq').oninput=e=>{clearTimeout(qt);const val=e.target.value;qt=setTimeout(()=>draw(val),250);};
  draw();
}

/* =========================================================
   VIEW: RATES / VISA / INSURANCE / INVOICES
   ========================================================= */
function simpleTable(cols,rows,searchKeys){
  const v=$('#view');v.innerHTML='';
  const c=el('div','card noprint');
  c.innerHTML='<input class="fld" id="sq" style="width:100%" placeholder="Search…">';
  v.append(c);
  const out=el('div');v.append(out);
  const draw=(q='')=>{
    out.innerHTML='';
    const f=rows.filter(r=>!q||searchKeys.some(k=>String(r[k]??'').toUpperCase().includes(q.toUpperCase())));
    out.append(el('div','hint',`${f.length} records`));
    const w=el('div','gridwrap');const t=el('table','list');
    t.innerHTML='<thead><tr>'+cols.map(c=>`<th${c.w?` style="width:${c.w}"`:''}>${c.t}</th>`).join('')+'</tr></thead>';
    const tb=el('tbody');
    f.slice(0,800).forEach(r=>{const tr=el('tr');
      tr.innerHTML=cols.map(c=>`<td>${c.f?c.f(r):esc(r[c.k]??'')}</td>`).join('');tb.append(tr);});
    t.append(tb);w.append(t);out.append(w);
    if(f.length>800) out.append(el('div','hint',`Showing first 800 of ${f.length}.`));
  };
  let qt;$('#sq').oninput=e=>{clearTimeout(qt);const val=e.target.value;qt=setTimeout(()=>draw(val),250);};
  draw();
}
function renderRates(){$('#tools').innerHTML='';
  simpleTable([{t:'Work Item',k:'item'},{t:'Rate (Cost)',k:'rate',w:'120px',f:r=>money2(r.rate)},
    {t:'Fee',k:'fee',w:'120px',f:r=>money2(r.fee)},{t:'Charge',w:'120px',f:r=>`<b>${money2(n(r.rate)+n(r.fee))}</b>`}],
    D.rates,['item']);}
function renderVisa(){$('#tools').innerHTML='';
  const steps=Object.keys(D.visa[0]?.steps||{});
  const cols=[{t:'Company',k:'company'},{t:'Employee',k:'employee'},
    ...steps.map(s=>({t:s.replace(/ /g,' '),f:r=>`<span class="pill${r.steps[s]?' on':''}"></span>`,w:'46px'})),
    {t:'Progress',w:'90px',f:r=>{const d=steps.filter(s=>r.steps[s]).length;return `<b>${d}/${steps.length}</b>`;}}];
  simpleTable(cols,D.visa,['company','employee']);}
function renderInsurance(){$('#tools').innerHTML='';
  const soon=D.insurance.filter(x=>{if(!x.expiry)return false;
    const d=new Date(x.expiry),t=new Date();const diff=(d-t)/864e5;return diff>=0&&diff<=30;});
  const v=$('#view');
  simpleTable([{t:'Company',k:'company'},{t:'Worker',k:'worker'},{t:'EID/UID',k:'eid',w:'150px'},
    {t:'Coverage',k:'coverage',w:'90px'},{t:'Inception',k:'inception',w:'110px',f:r=>fmtDate(r.inception)},
    {t:'Expiry',k:'expiry',w:'110px',f:r=>{const d=r.expiry?new Date(r.expiry):null;
      const dd=d?(d-new Date())/864e5:999;
      return `<span style="font-weight:${dd<=30?700:400};color:${dd<0?'#b71c1c':dd<=30?'#b45309':'inherit'}">${fmtDate(r.expiry)}</span>`;}},
    {t:'Premium',k:'total',w:'100px',f:r=>money2(r.total)}],D.insurance,['company','worker','eid']);
  if(soon.length){const b=el('div','card');b.style.background='#fef3c7';b.style.borderColor='#fbbf24';
    b.innerHTML=`<b>⚠ ${soon.length} insurance policies expiring within 30 days.</b>`;
    v.insertBefore(b,v.firstChild);}}
function renderInvoices(){$('#tools').innerHTML='';
  simpleTable([{t:'Invoice No',k:'InvoiceNo',w:'110px'},{t:'Date',k:'InvoiceDate',w:'110px'},
    {t:'Bill To',k:'BillTo'},{t:'Applicant',k:'Applicant'},{t:'Service Type',k:'ServiceType'},
    {t:'Govt',k:'GovtSubtotal',w:'90px',f:r=>money2(r.GovtSubtotal)},
    {t:'Fee',k:'ServiceFee',w:'80px',f:r=>money2(r.ServiceFee)},
    {t:'VAT',k:'VAT',w:'70px',f:r=>money2(r.VAT)},
    {t:'Grand Total',k:'GrandTotal',w:'110px',f:r=>`<b>${money2(r.GrandTotal)}</b>`},
    {t:'PDF',w:'50px',f:r=>r.PDF_Link?`<a href="${esc(r.PDF_Link)}" target="_blank">open</a>`:''}],
    D.invoices,['InvoiceNo','BillTo','Applicant','ServiceType']);
  const v=$('#view');const b=el('div','card');b.style.background='#eff6ff';b.style.borderColor='#93c5fd';
  b.innerHTML='<b>Read-only in Phase 1.</b> Invoice creation, templates and PDF generation come in Phase 2.';
  v.insertBefore(b,v.firstChild);}

/* =========================================================
   VIEW: DATA / BACKUP
   ========================================================= */
function renderData(){
  $('#tools').innerHTML='';
  const v=$('#view');v.innerHTML='';
  const counts=[['Work transactions',D.transactions.length],['Payments (BALANCES)',D.payments.length],
    ['Companies',D.companies.length],['Rates',D.rates.length],['Contacts',D.contacts.length],
    ['Invoices',D.invoices.length],['Invoice items',D.invoiceItems.length],
    ['Task templates',D.taskTemplates.length],['Insurance records',D.insurance.length],['Visa files',D.visa.length]];
  const k=el('div','kpis');
  counts.forEach(([t,val])=>{const c=el('div','kpi');c.append(el('div','t',t));c.append(el('div','v',String(val)));k.append(c);});
  v.append(k);

  const c=el('div','card');
  c.innerHTML='<div style="font-weight:800;margin-bottom:8px">Backup &amp; Restore</div><div class="row" id="dbtn"></div>';
  v.append(c);
  const b=$('#dbtn');
  const mk=(txt,cls,fn)=>{const x=el('button','btn '+(cls||''),txt);x.onclick=fn;b.append(x);return x;};
  mk('⬇ Export JSON backup','p',()=>{
    dl(new Blob([JSON.stringify(D)],{type:'application/json'}),`timelink-backup-${today()}.json`);});
  mk('⬇ Export transactions CSV','',()=>{
    const h=['DATE','COMPANY NAME','EMPLOYEE NAME','WORK','RECEIVED','EXPENSE','PROFIT','PAID FROM'];
    const rows=D.transactions.map(t=>[t.date,t.company,t.employee,t.work,t.received,t.expense,t.profit,t.paidFrom]);
    dl(new Blob([csv([h,...rows])],{type:'text/csv'}),`transactions-${today()}.csv`);});
  mk('⬇ Export payments CSV','',()=>{
    const rows=D.payments.map(p=>[p.date,p.amount,p.company,p.remark]);
    dl(new Blob([csv([['DATE','AMOUNT','COMPANY NAME','REMARKS'],...rows])],{type:'text/csv'}),`payments-${today()}.csv`);});
  const imp=el('input');imp.type='file';imp.accept='.json';imp.style.display='none';
  imp.onchange=async e=>{const f=e.target.files[0];if(!f)return;
    try{const j=JSON.parse(await f.text());if(!j.transactions)throw 0;
      D=j;await kvSet('data',D);toast('Backup restored');switchView('entry');}
    catch(x){alert('Invalid backup file.');}};
  b.append(imp);
  mk('⬆ Restore from JSON','',()=>imp.click());
  mk('↺ Reset to original sheet data','d',async()=>{
    if(!confirm('Discard all changes and reload the data imported from your Google Sheet?'))return;
    D=freshSeed(); await kvSet('data',D); toast('Reset to sheet data'); switchView('entry');});

  const nb=el('div','card');
  nb.style.background='#fffbeb';nb.style.borderColor='#fcd34d';
  nb.innerHTML=`<div style="font-weight:800;margin-bottom:6px">Note on imported history</div>
   <div class="hint" style="line-height:1.6">The workbook you provided contains only the <b>FROM JAN 2026</b> work sheet
   (${D.transactions.length} rows). The older tabs referenced by your Apps Script — <b>NOV 24 – JAN 25</b> and
   <b>FROM FEB 2025</b> — are not in this file, so statements before Jan 2026 will show payments but not the matching work rows.
   Send those two tabs and they will import into the same structure.</div>`;
  v.append(nb);
}
function csv(rows){return rows.map(r=>r.map(c=>{const s=String(c??'');
  return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n');}
function dl(blob,name){const a=el('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('Downloaded '+name);}

/* =========================================================
   ROUTER
   ========================================================= */
const VIEWS={entry:['DATA ENTRY',renderEntry],statement:['STATEMENT OF ACCOUNT',renderStatement],
  payments:['PAYMENTS RECEIVED',renderPayments],companies:['COMPANIES & BALANCES',renderCompanies],
  rates:['RATES MASTER',renderRates],visa:['VISA TRACKER',renderVisa],
  insurance:['INSURANCE DATA',renderInsurance],invoices:['INVOICES',renderInvoices],
  data:['DATA & BACKUP',renderData]};
function switchView(v){
  acHide();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  const [title,fn]=VIEWS[v]; $('#vtitle').textContent=title; fn();
}
document.querySelectorAll('#nav a').forEach(a=>a.onclick=()=>switchView(a.dataset.v));

/* ---------- boot ---------- */
function freshSeed(){
  const d=JSON.parse(JSON.stringify(SEED));
  d.transactions.forEach((t,i)=>{t.id=uid();t._s=i;});
  return d;
}
(async function boot(){
  const stored=await kvGet('data');
  D = (stored && stored.transactions) ? stored : freshSeed();
  D.transactions.forEach((t,i)=>{if(!t.id)t.id=uid();if(t._s===undefined)t._s=i;});
  if(!stored) await kvSet('data',D);
  switchView('entry');
})();
</script>
