<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TIME LINK · Business Suite</title>
<style>
/* =========================================================
   TIME LINK — Liquid Glass Design System
   ========================================================= */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap');

:root{
  --brand:#6366f1; --brand2:#818cf8; --brand3:#4f46e5;   /* indigo primary */
  --teal:#14b8a6; --violet:#a855f7; --pink:#ec4899; --sky:#38bdf8;
  --gold:#f59e0b;
  --pos:#22c55e; --neg:#f43f5e; --warn:#f59e0b; --info:#38bdf8;
  --r-sm:10px; --r:16px; --r-lg:22px; --r-xl:30px;
  --ease:cubic-bezier(.22,1,.36,1);
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}

/* ---- DARK GLASS ---- */
html[data-theme="dark"]{
  --bg0:#04141a; --bg1:#07222b; --bg2:#0a2f36;
  --mesh1:rgba(20,184,166,.28); --mesh2:rgba(56,189,248,.18); --mesh3:rgba(251,191,36,.10);
  --glass:rgba(255,255,255,.055);
  --glass-2:rgba(255,255,255,.085);
  --glass-hi:rgba(255,255,255,.14);
  --stroke:rgba(255,255,255,.12);
  --stroke-2:rgba(255,255,255,.20);
  --ink:#eaf6f4; --ink-2:rgba(234,246,244,.72); --ink-3:rgba(234,246,244,.45);
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --shadow-sm:0 6px 18px rgba(0,0,0,.30);
  --row:rgba(255,255,255,.028);
  --row-alt:rgba(255,255,255,.055);
  --row-hi:rgba(20,184,166,.14);
  --field:rgba(255,255,255,.07);
  --head:rgba(4,20,26,.72);
  --band:rgba(255,255,255,.09);
  --band-stroke:rgba(255,255,255,.16);
  --cbbg:rgba(0,0,0,.22); --cbstroke:rgba(255,255,255,.14);
  --cbrow:rgba(255,255,255,.05); --cbrow-alt:rgba(255,255,255,.09); --cbrow-blank:rgba(255,255,255,.02);
  --cbhead:rgba(0,0,0,.34);
}
/* ---- LIGHT (primary theme) ---- */
html[data-theme="light"]{
  --bg0:#f3f2fd; --bg1:#eae8fb; --bg2:#fdfcff;
  --mesh1:rgba(129,140,248,.42); --mesh2:rgba(236,72,153,.20); --mesh3:rgba(45,212,191,.28);
  --glass:rgba(255,255,255,.55);
  --glass-2:rgba(255,255,255,.72);
  --glass-hi:rgba(255,255,255,.95);
  --stroke:rgba(255,255,255,.75);
  --stroke-2:rgba(31,74,120,.16);
  --ink:#16324f; --ink-2:rgba(22,50,79,.66); --ink-3:rgba(22,50,79,.42);
  --shadow:0 18px 44px rgba(31,74,120,.13);
  --shadow-sm:0 4px 16px rgba(31,74,120,.09);
  --row:rgba(255,255,255,.34);        /* spare rows — barely there */
  --row-alt:rgba(255,255,255,.34);
  --row-fill:rgba(255,255,255,.74);   /* rows with data — clearly denser */
  --row-zebra:rgba(232,237,247,.68);  /* every other row */
  --row-hi:rgba(99,102,241,.13);
  --field:rgba(255,255,255,.72);
  --head:rgba(255,255,255,.80);
  --band:linear-gradient(150deg,rgba(224,222,252,.86),rgba(238,236,253,.72));
  --band-stroke:rgba(99,102,241,.20);
  --cbbg:rgba(226,231,242,.82); --cbstroke:rgba(31,74,120,.16);
  --cbrow:rgba(255,255,255,.70); --cbrow-alt:rgba(226,232,244,.62); --cbrow-blank:rgba(255,255,255,.26);
  --cbhead:rgba(222,228,240,.92);
}
html[data-theme="dark"]{--row-fill:rgba(255,255,255,.075);--row-zebra:rgba(255,255,255,.115)}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink); background:var(--bg0);
  -webkit-font-smoothing:antialiased; font-size:14px;
}
/* soft light canvas */
body::before{
  content:"";position:fixed;inset:-30%;z-index:-3;
  background:
    radial-gradient(46% 46% at 12% 8%, var(--mesh1) 0%, transparent 60%),
    radial-gradient(44% 44% at 86% 12%, var(--mesh2) 0%, transparent 58%),
    radial-gradient(52% 52% at 72% 92%, var(--mesh3) 0%, transparent 60%),
    linear-gradient(160deg,var(--bg1),var(--bg0) 52%,var(--bg2));
  filter:blur(34px); animation:drift 40s ease-in-out infinite alternate;
}
/* deep shapes floating behind the frosted panels */
#deep{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
#deep i{position:absolute;display:block;border-radius:50%;filter:blur(4px);opacity:.5}
#deep i:nth-child(1){width:340px;height:340px;left:-90px;top:8%;
  background:radial-gradient(circle at 32% 30%,#a5b4fc,#6366f1 62%,transparent 72%);animation:float1 26s ease-in-out infinite alternate}
#deep i:nth-child(2){width:230px;height:230px;right:6%;top:-70px;
  background:radial-gradient(circle at 35% 32%,#f9a8d4,#ec4899 62%,transparent 72%);opacity:.36;animation:float2 30s ease-in-out infinite alternate}
#deep i:nth-child(3){width:300px;height:300px;right:-80px;bottom:6%;
  background:radial-gradient(circle at 32% 30%,#5eead4,#14b8a6 62%,transparent 72%);opacity:.34;animation:float1 34s ease-in-out infinite alternate-reverse}
#deep i:nth-child(4){width:180px;height:180px;left:26%;bottom:-60px;
  background:radial-gradient(circle at 34% 30%,#fcd34d,#f59e0b 62%,transparent 72%);opacity:.30;animation:float2 24s ease-in-out infinite alternate}
#deep i:nth-child(5){width:120px;height:120px;left:52%;top:12%;border-radius:34px;transform:rotate(24deg);
  background:linear-gradient(135deg,#818cf8,#c4b5fd);opacity:.22;animation:float2 28s ease-in-out infinite alternate-reverse}
@keyframes float1{0%{transform:translate3d(0,0,0)}100%{transform:translate3d(34px,-42px,0) scale(1.09)}}
@keyframes float2{0%{transform:translate3d(0,0,0) rotate(0)}100%{transform:translate3d(-30px,38px,0) rotate(14deg) scale(1.12)}}
@media (prefers-reduced-motion:reduce){#deep i{animation:none}}
html[data-theme="dark"] body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:radial-gradient(circle at 1px 1px, var(--stroke) 1px, transparent 0);
  background-size:26px 26px;
}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(-3%,2%,0) scale(1.08)}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--stroke-2);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--brand);background-clip:content-box}

/* =========================================================
   SHELL
   ========================================================= */
#app{display:flex;height:100vh;gap:0}
#side{
  width:246px;flex:0 0 246px;margin:14px 0 14px 14px;
  background:var(--glass);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--stroke);border-radius:var(--r-xl);box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;position:relative;
}
#side::before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,var(--glass-hi),transparent)}
.brand{padding:20px 18px 16px;display:flex;align-items:center;gap:11px}
.brand svg{flex:0 0 auto;filter:drop-shadow(0 5px 14px rgba(99,102,241,.45))}
.brand .bt b{display:block;font-size:15px;font-weight:900;letter-spacing:2.6px;line-height:1.1}
.brand .bt span{display:block;font-size:9px;letter-spacing:1.1px;color:var(--ink-3);text-transform:uppercase;margin-top:3px}
nav{padding:10px 10px;flex:1;overflow-y:auto;overflow-x:hidden}
.ngrp{font-size:9.5px;font-weight:800;letter-spacing:1.4px;color:var(--ink-3);text-transform:uppercase;padding:12px 10px 6px}
nav a{
  display:flex;align-items:center;gap:11px;padding:10px 13px;margin-bottom:3px;border-radius:13px;
  color:var(--ink-2);text-decoration:none;font-size:13.2px;font-weight:600;cursor:pointer;
  transition:.22s var(--ease);position:relative;border:1px solid transparent;
}
nav a .ic{width:18px;text-align:center;font-size:14px;opacity:.8;flex:0 0 18px}
nav a:hover{background:var(--glass-hi);color:var(--ink)}
html[data-theme="light"] nav a.on{
  background:#fff;color:var(--ink);border-color:var(--stroke);
  box-shadow:0 4px 14px rgba(31,74,120,.10);font-weight:700;
}
html[data-theme="light"] nav a.on .ic{color:var(--brand3);opacity:1}
html[data-theme="dark"] nav a.on{
  background:linear-gradient(100deg,rgba(20,184,166,.26),rgba(20,184,166,.08));
  color:var(--ink);border-color:rgba(20,184,166,.34);
}
nav a.on::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:4px;height:20px;background:linear-gradient(180deg,#818cf8,#6366f1);border-radius:0 4px 4px 0}
nav a .tag{margin-left:auto;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:99px;
  background:var(--neg);color:#fff;letter-spacing:.3px;line-height:1.4}
.sfoot{padding:12px 14px;display:flex;align-items:center;gap:8px}
.themebtn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:8px;border-radius:10px;
  background:var(--glass-2);border:1px solid var(--stroke);color:var(--ink-2);cursor:pointer;
  font-size:11.5px;font-weight:700;transition:.2s;
}
.themebtn:hover{background:var(--glass-hi);color:var(--ink)}

#main{flex:1;display:flex;flex-direction:column;min-width:0;padding:14px}
/* one deeper band holding the title, tools and the view's own filters */
.topbar{
  background:var(--band);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);
  border:1px solid var(--band-stroke);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);
  padding:12px 18px;display:flex;flex-direction:column;gap:0;margin-bottom:14px;
}
.tbmain{display:flex;align-items:center;gap:14px;flex-wrap:wrap;width:100%}
#subbar:not(:empty){margin-top:11px;padding-top:11px;border-top:1px solid var(--band-stroke)}
.topbar h1{font-size:16.5px;margin:0;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:9px}
.topbar h1 .dot{width:8px;height:8px;border-radius:99px;background:linear-gradient(140deg,#818cf8,#6366f1);box-shadow:0 0 12px rgba(99,102,241,.8)}
.topbar .sub{font-size:11.5px;color:var(--ink-3);font-weight:500}
/* top search pill, as in the reference layout */
.tsearch{flex:1;min-width:180px;max-width:420px;display:flex;align-items:center;gap:9px;
  background:var(--field);border:1px solid var(--stroke);border-radius:99px;padding:8px 15px;
  cursor:pointer;transition:.2s;color:var(--ink-3);font-size:12.8px}
.tsearch:hover{border-color:var(--brand);color:var(--ink-2);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.tsearch .kbd{margin-left:auto;font-size:9.5px;font-weight:800;letter-spacing:.5px;
  border:1px solid var(--stroke-2);border-radius:6px;padding:2px 6px}
@media(max-width:900px){.tsearch{display:none}}
.spacer{flex:1}
#tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding-right:2px}

/* =========================================================
   PRIMITIVES
   ========================================================= */
.glass{
  background:var(--glass);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--stroke);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);position:relative;
}
.glass::before{content:"";position:absolute;inset:0 0 auto;height:1px;
  border-radius:var(--r-lg) var(--r-lg) 0 0;
  background:linear-gradient(90deg,transparent,var(--glass-hi),transparent);pointer-events:none;z-index:6}
.card{padding:18px;margin-bottom:14px}
.card h3{margin:0 0 13px;font-size:11.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3)}

.btn{
  border:1px solid var(--stroke-2);background:var(--glass-2);color:var(--ink);
  padding:8px 15px;border-radius:99px;cursor:pointer;font-size:12.5px;font-weight:700;
  transition:.2s var(--ease);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{background:var(--glass-hi);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0)}
.btn.p{background:linear-gradient(135deg,var(--brand),var(--brand3));border-color:transparent;color:#fff;
  box-shadow:0 5px 16px rgba(13,148,136,.30)}
.btn.p:hover{box-shadow:0 7px 22px rgba(13,148,136,.42)}
.btn.g{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:transparent;color:#fff;box-shadow:0 5px 16px rgba(22,163,74,.28)}
.btn.d{border-color:rgba(244,63,94,.45);color:var(--neg);background:rgba(244,63,94,.08)}
.btn.d:hover{background:rgba(244,63,94,.16)}
.btn.sm{padding:4px 10px;font-size:11.5px;border-radius:8px}
.btn.ico{padding:7px 9px}

.fld{
  border:1px solid var(--stroke);background:var(--field);color:var(--ink);
  padding:8px 11px;border-radius:10px;font-size:13px;outline:none;transition:.2s;width:100%;
  backdrop-filter:blur(8px);font-family:inherit;
}
.fld:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(99,102,241,.18);background:#fff}
.fld::placeholder{color:var(--ink-3)}
select.fld{cursor:pointer}
html[data-theme="dark"] select.fld option{background:#07222b;color:#eaf6f4}
input[type=date].fld::-webkit-calendar-picker-indicator{filter:invert(var(--inv,0));cursor:pointer;opacity:.6}
html[data-theme="dark"]{--inv:1}
label.lb{font-size:9.8px;font-weight:800;color:var(--ink-3);text-transform:uppercase;letter-spacing:1.1px;display:block;margin-bottom:5px}
.row{display:flex;gap:11px;align-items:flex-end;flex-wrap:wrap}
.f{flex:1;min-width:150px}
.hint{font-size:11.5px;color:var(--ink-3);padding:8px 2px;line-height:1.6}

/* =========================================================
   DATA ENTRY — a slim strip in the right of the top band
   ========================================================= */



.btn.dfbtn{font-family:inherit;font-size:11.5px}
.btn.dfbtn.act{background:rgba(99,102,241,.14);border-color:rgba(99,102,241,.36);color:var(--brand3)}

.statstrip{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:6px;padding:4px 11px;border-radius:99px;
  background:rgba(255,255,255,.80);border:1px solid var(--band-stroke)}
.stat .sl{font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3)}
.stat .sv{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.stat.pos .sv{color:var(--pos)} .stat.neg .sv{color:var(--neg)}
.stat.muted .sv{color:var(--ink-2)}


/* accounts: their own card, generously sized */
.acctpanel{padding:14px 16px;margin-bottom:12px}
.acctpanel .ah{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.acctpanel .ah h3{margin:0;flex:1}
.acctgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(184px,1fr));gap:11px}
.acard{position:relative;overflow:hidden;padding:14px 16px;border-radius:var(--r);cursor:pointer;
  color:#fff;background:linear-gradient(140deg,var(--ac),color-mix(in srgb,var(--ac) 62%,#111827));
  box-shadow:0 8px 22px color-mix(in srgb,var(--ac) 34%,transparent);
  transition:transform .22s var(--ease),box-shadow .22s var(--ease)}
.acard:hover{transform:translateY(-3px);box-shadow:0 14px 30px color-mix(in srgb,var(--ac) 46%,transparent)}
.acard::after{content:"";position:absolute;right:-30px;top:-46px;width:120px;height:120px;
  border-radius:50%;background:rgba(255,255,255,.17);pointer-events:none}
.acard .an{font-size:9.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;
  color:rgba(255,255,255,.85);display:flex;align-items:center;gap:6px}
.acard .av{font-size:25px;font-weight:800;letter-spacing:-1px;margin-top:6px;
  font-variant-numeric:tabular-nums;line-height:1.1}
.acard .ak{font-size:10px;font-weight:600;color:rgba(255,255,255,.78);margin-top:3px}
.acard .flag{position:absolute;right:13px;top:13px;font-size:8.5px;font-weight:800;letter-spacing:.6px;
  text-transform:uppercase;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.22)}
@supports not (background:color-mix(in srgb,red 10%,transparent)){
  .acard{background:var(--ac);box-shadow:var(--shadow-sm)}
}

/* locked rows: saved data needs a double-click before it can be edited */
table.grid tbody tr.locked .cell,table.grid tbody tr.locked .pf{cursor:default}
table.grid tbody tr.locked:hover td{background:var(--row-hi)}
table.grid tbody tr.locked:hover td:first-child::after{content:"dbl-click";position:absolute;
  font-size:7.5px;font-weight:800;letter-spacing:.3px;color:var(--brand3);opacity:.85;
  transform:translate(-2px,11px)}
table.grid tbody tr.locked td:first-child{position:relative}
table.grid tbody tr.editing td{background:rgba(99,102,241,.10)}
table.grid tbody tr.editing td:first-child{box-shadow:inset 3px 0 0 var(--brand)}

/* account history modal header */
.achead{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:16px 18px;border-radius:var(--r);
  color:#fff;background:linear-gradient(140deg,var(--ac),color-mix(in srgb,var(--ac) 60%,#111827))}
.achead .l .k{font-size:9.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;opacity:.85}
.achead .l .b{font-size:30px;font-weight:800;letter-spacing:-1.2px;margin-top:4px;font-variant-numeric:tabular-nums}
.achead .r{margin-left:auto;display:flex;gap:20px;flex-wrap:wrap}
.achead .r>div{text-align:right}
.achead .r span{display:block;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;opacity:.78}
.achead .r b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
@supports not (background:color-mix(in srgb,red 10%,transparent)){.achead{background:var(--ac)}}

/* template edit button */
.btn.tpledit{border-color:rgba(99,102,241,.4);color:var(--brand3);background:rgba(99,102,241,.10)}
.btn.tpledit:hover{background:rgba(99,102,241,.18)}

/* =========================================================
   CASH BOOK
   ========================================================= */
.cbwrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:1150px){.cbwrap{grid-template-columns:1fr}}
.cbcol{padding:0;overflow:hidden;background:var(--cbbg);border-color:var(--cbstroke)}
.cbcol .cbgrid td{background:var(--cbrow)}
.cbcol .cbgrid tbody tr.blank td{background:var(--cbrow-blank)}
.cbcol .cbgrid tbody tr:hover td{background:var(--row-hi)}
.cbcol .cbgrid th,.cbcol tfoot td{background:var(--cbhead)}
.cbhead{display:flex;align-items:center;gap:12px;padding:13px 16px;color:#fff;
  background:linear-gradient(140deg,var(--ac),color-mix(in srgb,var(--ac) 62%,#111827))}
@supports not (background:color-mix(in srgb,red 10%,transparent)){.cbhead{background:var(--ac)}}
.cbhead .nm{font-size:11.5px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase}
.cbhead .bal{font-size:21px;font-weight:800;letter-spacing:-.7px;font-variant-numeric:tabular-nums;margin-left:auto}
.cbhead .cbpick{width:auto;flex:0 0 auto;padding:5px 9px;font-size:11px;border-radius:99px;
  background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.34);color:#fff;font-weight:700}
html[data-theme="light"] .cbhead .cbpick option{color:var(--ink)}
.cbgrid{max-height:calc(100vh - 430px);border-radius:0}
.cbcol tfoot td.cbin{color:var(--pos)} .cbcol tfoot td.cbout{color:var(--neg)}
.cbcol>div:last-child{padding:0 14px 14px}
.cblink{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:17px;height:17px;
  border-radius:99px;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:900;line-height:1;pointer-events:none;opacity:0}
.cblink.on{opacity:1;background:#22c55e;color:#fff;box-shadow:0 1px 5px rgba(34,197,94,.45)}
.cblink.out{opacity:1;background:rgba(244,63,94,.16);color:#be123c;border:1px solid rgba(244,63,94,.32)}
tr.fromcb td{background:rgba(34,197,94,.07)}
tr.fromcb td:first-child{box-shadow:inset 3px 0 0 var(--pos)}

body.nobar .topbar{display:none}
body.nobar #main{padding-top:14px}

/* =========================================================
   DATA ENTRY LAYOUT
   [ accounts | search ]   cash book
   [        sheet      ]   rail
   ========================================================= */
.entrylayout{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:14px;align-items:start}
@media(max-width:1500px){.entrylayout{grid-template-columns:minmax(0,1fr) 380px}}
@media(max-width:1250px){.entrylayout{grid-template-columns:1fr}}
.entrymain{min-width:0;display:flex;flex-direction:column;gap:12px}
.entrytop{display:grid;grid-template-columns:minmax(0,1fr) 268px;gap:12px;align-items:stretch}
@media(max-width:1000px){.entrytop{grid-template-columns:1fr}}

/* account chips */
.acctpanel{padding:12px;margin:0;display:flex;align-items:center}
.acctgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;width:100%}
.acard{position:relative;overflow:hidden;padding:11px 12px;border-radius:14px;cursor:pointer;
  text-align:center;background:var(--field);border:2px solid var(--ac);
  box-shadow:0 3px 10px color-mix(in srgb,var(--ac) 16%,transparent);
  transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.acard:hover{transform:translateY(-2px);box-shadow:0 9px 20px color-mix(in srgb,var(--ac) 30%,transparent)}
.acard .an{font-size:9.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;
  color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .av{font-size:17px;font-weight:800;letter-spacing:-.6px;margin-top:3px;
  font-variant-numeric:tabular-nums;line-height:1.1;color:var(--ac)}
.acard .ak{display:none}
.acard .flag{position:absolute;right:6px;top:5px;font-size:7.5px;font-weight:800;letter-spacing:.4px;
  text-transform:uppercase;padding:1px 6px;border-radius:99px;background:var(--ac);color:#fff;opacity:.9}
@supports not (background:color-mix(in srgb,red 10%,transparent)){
  .acard{box-shadow:var(--shadow-sm)}
}

/* search block */
.searchpanel{padding:12px;margin:0;display:flex;flex-direction:column;gap:8px}
.btn.srchbtn{width:100%;justify-content:center;font-size:11.5px;letter-spacing:.5px;
  background:linear-gradient(140deg,#818cf8,#6366f1);border-color:transparent;color:#fff;
  box-shadow:0 5px 14px rgba(99,102,241,.28)}
.searchpanel .fld.search{width:100%;padding:7px 13px;font-size:12.3px;border-radius:99px}
.sprow{display:flex;gap:7px}
.sprow .btn{flex:1;justify-content:center;font-size:10.8px;padding:5px 8px}
.btn.dfbtn{font-family:inherit}
.btn.dfbtn.act{background:rgba(99,102,241,.14);border-color:rgba(99,102,241,.36);color:var(--brand3)}
.searchpanel .statstrip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:2px}
.searchpanel .stat{flex-direction:column;align-items:center;gap:1px;padding:5px 4px;border-radius:10px}
.searchpanel .stat .sl{font-size:8px;letter-spacing:.6px}
.searchpanel .stat .sv{font-size:12.5px}

.statstrip{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:6px;padding:4px 11px;border-radius:99px;
  background:rgba(255,255,255,.80);border:1px solid var(--band-stroke)}
.stat .sl{font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3)}
.stat .sv{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.stat.pos .sv{color:var(--pos)} .stat.neg .sv{color:var(--neg)}
.stat.muted .sv{color:var(--ink-2)}

/* cash book rail */
.cbpanel{display:flex;flex-direction:column;gap:12px;min-width:0}
.cbpanel.solo{height:calc(100vh - 60px)}
.cbpanel.solo .cbcol{display:flex;flex-direction:column;height:100%}
.cbmini .cbgrid{flex:1;max-height:none;min-height:200px}
.cbmini .cell{padding-right:26px}
.cbmini td.num .cell{padding-right:8px}
.cbmini .cbhead{padding:9px 12px}
.cbmini .cbhead .nm{font-size:10px;letter-spacing:1px}
.cbmini .cbhead .bal{font-size:16px}
.cbmini .cbhead .cbpick{padding:3px 7px;font-size:9.5px}
.cbmini .cell{font-size:12.2px;padding:6px 8px}
.cbmini input[type=date].cell{font-size:10.2px;letter-spacing:-.2px;padding:6px 2px 6px 6px}
.cbcol .cbgrid tbody tr.alt td{background:var(--cbrow-alt)}
.cbcol .cbgrid tbody tr.alt.blank td{background:var(--cbrow-blank)}
.cbcol .cbgrid tbody tr:hover td{background:var(--row-hi)}
.cbmini tfoot td{padding:8px 7px;font-size:11px}
.cbmini>div:last-child{padding:0 11px 11px}
.cbmini .cblink{width:16px;height:16px;font-size:9.5px}
.cblink.xfer{opacity:1;background:#6366f1;color:#fff;box-shadow:0 1px 5px rgba(99,102,241,.45)}
tr.mirror td{background:rgba(99,102,241,.08)}
tr.mirror td:first-child{box-shadow:inset 3px 0 0 var(--brand)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(162px,1fr));gap:13px;margin-bottom:14px}
.kpi{padding:16px 17px;overflow:hidden}
.kpi .t{font-size:9.5px;font-weight:800;color:var(--ink-3);text-transform:uppercase;letter-spacing:1.1px;display:flex;align-items:center;gap:5px}
.kpi .v{font-size:25px;font-weight:800;margin-top:7px;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .s{font-size:10.5px;color:var(--ink-3);margin-top:4px;font-weight:600}
.kpi .v.neg{color:var(--neg)} .kpi .v.pos{color:var(--pos)} .kpi .v.gold{color:#d97706}
html[data-theme="light"] .kpi.accent{background:linear-gradient(140deg,#ffffff,#eceafe);border-color:rgba(99,102,241,.26)}
html[data-theme="dark"] .kpi.accent{background:linear-gradient(135deg,rgba(99,102,241,.22),var(--glass))}

/* bright gradient KPI cards */
.kpi[class*="g-"]{border:0;color:#fff;box-shadow:0 10px 26px rgba(31,41,120,.22)}
.kpi[class*="g-"] .t,.kpi[class*="g-"] .s{color:rgba(255,255,255,.82)}
.kpi[class*="g-"] .v,.kpi[class*="g-"] .v.pos,.kpi[class*="g-"] .v.neg,.kpi[class*="g-"] .v.gold{color:#fff}
.kpi[class*="g-"]::after{content:"";position:absolute;right:-26px;top:-40px;width:110px;height:110px;
  border-radius:50%;background:rgba(255,255,255,.16);pointer-events:none}
.kpi[class*="g-"]::before{background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent)}
.kpi.g-indigo{background:linear-gradient(140deg,#6366f1,#4338ca)}
.kpi.g-violet{background:linear-gradient(140deg,#a855f7,#7c3aed)}
.kpi.g-pink  {background:linear-gradient(140deg,#f472b6,#db2777)}
.kpi.g-rose  {background:linear-gradient(140deg,#fb7185,#e11d48)}
.kpi.g-teal  {background:linear-gradient(140deg,#2dd4bf,#0d9488)}
.kpi.g-amber {background:linear-gradient(140deg,#fbbf24,#ea580c)}
.kpi.g-sky   {background:linear-gradient(140deg,#38bdf8,#0284c7)}

.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.5px}
.badge.bal{background:rgba(244,63,94,.16);color:var(--neg);border:1px solid rgba(244,63,94,.3)}
.badge.adv{background:rgba(16,185,129,.16);color:var(--pos);border:1px solid rgba(16,185,129,.3)}
.badge.w{background:rgba(245,158,11,.16);color:var(--warn);border:1px solid rgba(245,158,11,.3)}
.badge.i{background:rgba(56,189,248,.16);color:var(--info);border:1px solid rgba(56,189,248,.3)}

/* =========================================================
   DATA GRID
   ========================================================= */
.gridwrap{border-radius:var(--r-lg);overflow:auto;max-height:calc(100vh - 300px);position:relative}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:12.8px}
table.grid th{
  position:sticky;top:0;z-index:5;background:var(--head);
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  color:var(--ink-3);font-weight:800;font-size:10px;letter-spacing:1.1px;text-transform:uppercase;
  padding:13px 10px;border-bottom:1px solid var(--stroke-2);white-space:nowrap;text-align:left;
}
table.grid th.c{text-align:center}
table.grid th.rn{width:44px;text-align:center;color:var(--brand)}
/* every row is exactly the same height, blank or filled */
table.grid tbody tr{height:38px}
table.grid td{padding:0;border-bottom:1px solid var(--stroke);background:var(--row-fill);
  height:38px;max-height:38px;overflow:hidden;vertical-align:middle}
table.grid tbody tr:nth-child(even) td{background:var(--row-zebra)}
table.grid tbody tr.blank td{background:var(--row)}          /* spare rows sit lighter */
table.grid tbody tr.blank:nth-child(even) td{background:var(--row)}
table.grid tbody tr:hover td{background:var(--row-hi)}
table.grid tbody tr.sel td{background:var(--row-hi)}
table.grid tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--brand)}
td.profit .cell{font-weight:800}
td.rn{text-align:center;color:var(--ink-3);font-size:11px;font-family:var(--mono);width:44px}
tr.blank td.rn{color:var(--ink-3);opacity:.5}
.cell{
  width:100%;height:36px;line-height:22px;border:0;background:transparent;padding:7px 10px;font-size:12.8px;
  color:var(--ink);outline:none;display:block;font-family:inherit;border-radius:7px;
}
.cell::placeholder{color:var(--ink-3)}
/* compact date cell: hide the native picker chrome, keep the value */
input[type=date].cell{padding:7px 4px 7px 8px;font-size:12px;font-family:var(--mono)}
input[type=date].cell::-webkit-calendar-picker-indicator{
  opacity:0;width:14px;margin:0;padding:0;cursor:pointer}
input[type=date].cell:hover::-webkit-calendar-picker-indicator{opacity:.45}
input[type=date].cell::-webkit-inner-spin-button,
input[type=date].cell::-webkit-clear-button{display:none}
td.num .cell{text-align:center;font-family:var(--mono);font-size:12.2px}
.cell:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--brand);border-radius:8px}
.cell[readonly]{cursor:default}
td.profit .cell{font-weight:800;color:var(--pos)}
td.profit.neg .cell{color:var(--neg)}
/* fixed layout stops a long value from stretching a column */
table.grid{table-layout:fixed}
table.grid th,table.grid td{overflow:hidden}
/* Paid From pill — a span, so nothing intrinsic can stretch the row */
.pf{
  display:block;width:calc(100% - 12px);max-width:100%;margin:0 auto;
  height:24px;line-height:22px;box-sizing:border-box;
  border:1px solid transparent;border-radius:99px;padding:0 8px;
  font-size:9.8px;font-weight:800;letter-spacing:.5px;text-align:center;cursor:pointer;outline:none;
  transition:.18s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:inherit;color:#fff;user-select:none;
}
.pf.empty{background:transparent;color:var(--ink-3);font-weight:600;
  border-color:var(--stroke-2);border-style:dashed}
.pf.empty:hover{background:var(--field);border-style:solid}
td:has(>.pf){text-align:center;vertical-align:middle;line-height:0}
.pf:focus{box-shadow:0 0 0 3px rgba(99,102,241,.28)}

/* ---------- modal ---------- */
.modal-ov{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;
  background:rgba(2,12,16,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;transition:.22s var(--ease);padding:20px}
.modal-ov.on{opacity:1}
.modal{width:100%;max-width:620px;max-height:88vh;display:flex;flex-direction:column;
  border-radius:var(--r-lg);box-shadow:var(--shadow);transform:translateY(12px) scale(.98);transition:.22s var(--ease);
  background:var(--glass-2);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%)}
.modal-ov.on .modal{transform:none}
.modal-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--stroke)}
.modal-h b{flex:1;font-size:14.5px;font-weight:800;letter-spacing:.4px}
.modal-b{padding:18px;overflow-y:auto;flex:1}
.modal-f{display:flex;gap:9px;justify-content:flex-end;padding:13px 18px;border-top:1px solid var(--stroke)}
td.act{width:36px;text-align:center}
.del{border:0;background:transparent;color:var(--neg);cursor:pointer;font-size:17px;opacity:0;line-height:1;transition:.2s;padding:2px 6px;border-radius:6px}
tr:hover .del{opacity:.65}
.del:hover{opacity:1!important;background:rgba(244,63,94,.15)}
tfoot td{
  position:sticky;bottom:0;z-index:4;
  background:var(--head);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  color:var(--ink);font-weight:900;padding:11px 9px;font-size:12.6px;text-align:center;
  border-top:1px solid var(--brand);font-family:var(--mono);
}
tfoot td.l{text-align:right;padding-right:16px;font-family:Inter,sans-serif;letter-spacing:.8px;font-size:11px;color:var(--ink-3)}

/* list tables */
table.list{border-collapse:separate;border-spacing:0;width:100%;font-size:12.8px}
table.list th{position:sticky;top:0;z-index:3;background:var(--head);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  color:var(--ink-3);padding:12px 11px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1.1px;
  font-weight:800;border-bottom:1px solid var(--stroke-2);white-space:nowrap}
table.list td{padding:10px 11px;border-bottom:1px solid var(--stroke);background:var(--row)}
html[data-theme="dark"] table.list tbody tr:nth-child(even) td{background:var(--row-alt)}
table.list tbody tr:hover td{background:var(--row-hi)}
table.list td.n{font-family:var(--mono);font-size:12.2px;text-align:right}
table.list td.c{text-align:center}
.pill{display:inline-block;width:17px;height:17px;border-radius:5px;background:var(--field);border:1px solid var(--stroke)}
.pill.on{background:linear-gradient(135deg,#34d399,#059669);border-color:transparent;box-shadow:0 2px 8px rgba(5,150,105,.42)}
.pill.on::after{content:"✓";display:block;text-align:center;line-height:15px;font-size:11px;font-weight:900;color:#fff}

/* =========================================================
   STATEMENT
   ========================================================= */
table.st{border-collapse:separate;border-spacing:0;width:100%;font-size:12.6px}
table.st th{background:var(--head);backdrop-filter:blur(16px);color:var(--ink);padding:10px 9px;font-size:10.2px;
  letter-spacing:1.1px;text-transform:uppercase;font-weight:800;border-bottom:1px solid var(--brand);text-align:left;position:sticky;top:0;z-index:3}
table.st td{padding:8px 9px;border-bottom:1px solid var(--stroke);background:var(--row)}
table.st td.c{text-align:center;font-family:var(--mono);font-size:12px}
table.st tr:hover td{background:var(--row-hi)}
table.st tr.pay td{background:rgba(16,185,129,.10)}
table.st tr.pay:hover td{background:rgba(16,185,129,.18)}
table.st tr.open td{background:rgba(251,191,36,.14);font-weight:700}
table.st tr.tot td{background:linear-gradient(135deg,rgba(99,102,241,.22),rgba(168,85,247,.12));font-weight:900;border-top:1px solid var(--brand);font-size:13px}

/* =========================================================
   INVOICE BUILDER
   ========================================================= */
.invgrid{display:grid;grid-template-columns:1fr 340px;gap:12px;align-items:start}
@media(max-width:1150px){.invgrid{grid-template-columns:1fr}}
.invhead{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
@media(max-width:700px){.invhead{grid-template-columns:1fr}}
.invno{
  font-family:var(--mono);font-size:19px;font-weight:800;letter-spacing:1.6px;color:#fff;
  background:linear-gradient(140deg,#f472b6,#db2777);border:0;border-radius:12px;padding:10px 13px;width:100%;outline:none;
  box-shadow:0 8px 20px rgba(219,39,119,.28);
}
.invno:focus{box-shadow:0 0 0 3px rgba(219,39,119,.28)}
table.inv{border-collapse:separate;border-spacing:0;width:100%;font-size:12.6px}
table.inv th{background:var(--head);backdrop-filter:blur(16px);padding:10px 9px;font-size:10px;letter-spacing:1.1px;
  text-transform:uppercase;font-weight:800;color:var(--ink);border-bottom:1px solid var(--brand);text-align:left;position:sticky;top:0;z-index:3}
table.inv td{padding:0;border-bottom:1px solid var(--stroke);background:var(--row);height:34px}
table.inv tbody tr:nth-child(even) td{background:var(--row-alt)}
table.inv tbody tr:hover td{background:var(--row-hi)}
.tot-row{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid var(--stroke);font-size:12.8px}
.tot-row:last-child{border:0}
.tot-row .lbl{color:var(--ink-2);font-weight:600}
.tot-row .val{font-family:var(--mono);font-weight:800;font-size:13.5px}
.tot-row.grand{margin-top:6px;padding:15px;border-radius:14px;border:0;color:#fff;
  background:linear-gradient(140deg,#6366f1,#4338ca);box-shadow:0 10px 26px rgba(67,56,202,.30)}
.tot-row.grand .lbl{color:rgba(255,255,255,.86)!important}
.tot-row.grand .lbl{font-weight:900;letter-spacing:.6px;color:var(--ink)}
.tot-row.grand .val{font-size:22px;color:#fff}
.tot-row input{background:var(--field);border:1px solid var(--stroke);border-radius:8px;padding:5px 9px;width:118px;
  text-align:right;font-family:var(--mono);font-weight:800;font-size:13px;color:var(--ink);outline:none}
.tot-row input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(20,184,166,.18)}

/* =========================================================
   DASHBOARD
   ========================================================= */
.dash{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;align-items:start}
.dash>.card{margin-bottom:0}
/* a card header: title left, count or action right */
.ah{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.ah h3{margin:0}
.ah .hint{padding:0;margin-left:auto;font-size:10.5px;white-space:nowrap}
.ah .btn{margin-left:auto;align-self:center}
/* account summary strip */
.accsum{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.accsum>div{padding:9px 11px;border-radius:12px;background:var(--field);border:1px solid var(--stroke-2)}
.accsum span{display:block;font-size:8.8px;font-weight:800;letter-spacing:.9px;
  text-transform:uppercase;color:var(--ink-3)}
.accsum b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.accsum b.pos{color:var(--pos)} .accsum b.neg{color:var(--neg)} .accsum b.warn{color:var(--warn)}
.accgrp{font-size:8.8px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--ink-3);margin:10px 0 6px}
.acct{padding:8px 11px;margin-bottom:5px}
.acct .sw{width:7px;height:24px;flex:0 0 7px}
.acct .nm b{font-size:11.8px}
.acct .amt{font-size:14px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}
@media(max-width:1100px){.c8,.c6,.c4,.c3{grid-column:span 12}}
.acct{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;background:var(--glass-2);
  border:1px solid var(--stroke);margin-bottom:8px;transition:.2s var(--ease)}
.acct:hover{transform:translateX(3px);border-color:var(--stroke-2)}
.acct .sw{width:10px;height:36px;border-radius:99px;flex:0 0 10px}
.acct .nm{flex:1;min-width:0}
.acct .nm b{display:block;font-size:12.6px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct .nm span{font-size:10px;color:var(--ink-3)}
.acct .amt{font-family:var(--mono);font-weight:800;font-size:15px;text-align:right}
.bar{height:8px;border-radius:99px;background:rgba(99,102,241,.13);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#818cf8,#6366f1);
  box-shadow:0 0 8px rgba(99,102,241,.45)}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink-2);margin-top:8px}
.lgd i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
.rankrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--stroke);font-size:12.5px}
.rankrow:last-child{border:0}
.rankrow .i{width:26px;height:26px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:800;color:#fff;flex:0 0 26px;
  background:linear-gradient(140deg,#818cf8,#6366f1);box-shadow:0 3px 9px rgba(99,102,241,.30)}
.rankrow:nth-child(3n+1) .i{background:linear-gradient(140deg,#f472b6,#db2777);box-shadow:0 3px 9px rgba(219,39,119,.28)}
.rankrow:nth-child(3n+2) .i{background:linear-gradient(140deg,#2dd4bf,#0d9488);box-shadow:0 3px 9px rgba(13,148,136,.28)}
.rankrow:nth-child(4n) .i{background:linear-gradient(140deg,#fbbf24,#ea580c);box-shadow:0 3px 9px rgba(234,88,12,.26)}
.rankrow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.rankrow .v{font-family:var(--mono);font-weight:800;font-size:12.5px}

/* =========================================================
   MISC
   ========================================================= */
.acbox{position:fixed;z-index:200;background:var(--glass-2);backdrop-filter:blur(24px) saturate(150%);
  -webkit-backdrop-filter:blur(24px) saturate(150%);border:1px solid var(--stroke-2);border-radius:14px;
  box-shadow:var(--shadow);max-height:232px;overflow-y:auto;min-width:230px;display:none;padding:6px}
.acbox div{padding:8px 12px;font-size:12.6px;cursor:pointer;border-radius:9px;color:var(--ink);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.acbox div:hover,.acbox div.sel{background:linear-gradient(135deg,var(--brand),var(--brand3));color:#03201d;font-weight:700}
.acbox div.acadd{border-top:1px solid var(--stroke);margin-top:3px;padding-top:8px;
  display:flex;align-items:center;gap:6px;position:sticky;bottom:-6px;
  background:var(--glass-2);backdrop-filter:blur(24px)}
.acbox div.acadd b{color:var(--brand2)}
.acbox div.acadd:hover b,.acbox div.acadd.sel b{color:#03201d}
.acbox div.acadd .k{margin-left:auto;font-size:9.5px;font-weight:800;letter-spacing:.5px;
  border:1px solid var(--stroke-2);border-radius:5px;padding:1px 5px;opacity:.75}

/* sidebar search launcher */
a.searchbtn{margin:2px 0 6px;background:var(--glass-2);border:1px solid var(--stroke)!important;justify-content:flex-start}
a.searchbtn .kbd{margin-left:auto;font-size:9px;font-weight:800;letter-spacing:.5px;
  border:1px solid var(--stroke-2);border-radius:5px;padding:2px 5px;color:var(--ink-3)}
a.searchbtn:hover{border-color:var(--brand)!important}
nav a .tag{background:rgba(244,63,94,.2);color:#fda4af}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(14px);
  background:var(--glass-2);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--stroke-2);color:var(--ink);padding:11px 20px;border-radius:99px;font-size:12.6px;
  font-weight:700;z-index:300;opacity:0;transition:.3s var(--ease);pointer-events:none;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:8px}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .k{width:8px;height:8px;border-radius:99px;background:linear-gradient(140deg,#818cf8,#6366f1);box-shadow:0 0 10px rgba(99,102,241,.8)}
.toast.err .k{background:var(--neg);box-shadow:0 0 10px var(--neg)}
.note{padding:13px 15px;border-radius:12px;font-size:12.3px;line-height:1.65;margin-bottom:12px;border:1px solid}
.note.w{background:rgba(245,158,11,.10);border-color:rgba(245,158,11,.3)}
.note.i{background:rgba(56,189,248,.10);border-color:rgba(56,189,248,.3)}
.note b{color:var(--ink)}
.empty{text-align:center;padding:44px 20px;color:var(--ink-3)}
.empty .e{font-size:38px;opacity:.35;margin-bottom:10px}
.fade{animation:fade .34s var(--ease)}
.card,.kpi{transition:transform .22s var(--ease),box-shadow .22s var(--ease)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
/* =========================================================
   ATTACHMENTS / RECURRING
   ========================================================= */
.dropzone{border:2px dashed var(--stroke-2);border-radius:var(--r);padding:26px 16px;text-align:center;
  cursor:pointer;transition:.2s var(--ease);background:var(--field)}
.dropzone:hover,.dropzone.over{border-color:var(--brand);background:rgba(99,102,241,.07)}
.dropzone b{display:block;font-size:13.5px;margin-bottom:4px}
.dropzone span{font-size:11.5px;color:var(--ink-3)}
.attrow{display:flex;align-items:center;gap:11px;padding:10px 12px;margin-top:9px;
  border-radius:12px;background:var(--glass-2);border:1px solid var(--stroke-2)}
.attrow .ic{font-size:19px;flex:0 0 24px;text-align:center}
.attrow .nm{flex:1;min-width:0}
.attrow .nm b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attrow .nm span{font-size:10.5px;color:var(--ink-3)}
.attrow .acts{display:flex;gap:5px;flex:0 0 auto}
.btn.attachbtn.has{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.38);color:#15803d}

/* =========================================================
   MOBILE — drawer navigation, cards instead of wide grids
   ========================================================= */
#navtoggle{display:none;position:fixed;left:12px;top:12px;z-index:120;
  width:42px;height:42px;border-radius:14px;border:1px solid var(--stroke);
  background:var(--glass-2);backdrop-filter:blur(20px);color:var(--ink);
  font-size:17px;cursor:pointer;box-shadow:var(--shadow-sm)}
#scrim{display:none;position:fixed;inset:0;z-index:110;background:rgba(10,20,40,.42);
  backdrop-filter:blur(2px);opacity:0;transition:.22s}
#scrim.on{opacity:1}

@media(max-width:820px){
  #navtoggle{display:block}
  #scrim.on{display:block}
  #side{position:fixed;z-index:115;left:0;top:0;bottom:0;margin:0;width:264px;flex-basis:264px;
    border-radius:0 var(--r-xl) var(--r-xl) 0;transform:translateX(-104%);
    transition:transform .26s var(--ease)}
  body.navopen #side{transform:none}
  #main{padding:10px 10px 10px 10px}
  body.nobar #main,#main{padding-top:62px}
  .topbar{padding:10px 12px;border-radius:var(--r-lg)}
  .topbar h1{font-size:15px;margin-left:46px}
  #tools{width:100%;justify-content:flex-start}

  /* stack every split layout */
  .entrylayout,.entrytop,.cbwrap,.invgrid{grid-template-columns:1fr!important}
  .cbpanel.solo{height:auto}
  .dash>*{grid-column:span 12!important}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:21px}
  .acctgrid{grid-template-columns:1fr 1fr}
  .accsum{grid-template-columns:1fr 1fr}
  .searchpanel .statstrip{grid-template-columns:1fr 1fr 1fr}
  .modal{max-width:100%;max-height:92vh}
  .invhead{grid-template-columns:1fr}

  /* wide tables scroll sideways rather than crushing */
  .gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.grid,table.list,table.inv,table.st{min-width:660px}
  .cbmini .cbgrid table.grid{min-width:400px}

  /* comfortable touch targets */
  .cell{height:40px;font-size:14px}
  table.grid tbody tr,table.grid td{height:42px}
  .btn{padding:9px 15px;font-size:13px}
  .btn.sm{padding:6px 12px;font-size:12.5px}
  .pf{height:28px;line-height:26px;font-size:10.5px}
  .fld{padding:10px 13px;font-size:14px}    /* 14px stops iOS zooming on focus */
  nav a{padding:12px 14px;font-size:14px}
}
@media(max-width:480px){
  .kpis{grid-template-columns:1fr}
  .acctgrid{grid-template-columns:1fr}
  .sprow{flex-wrap:wrap}
}

/* =========================================================
   AI ASSISTANT
   ========================================================= */
#aifab{position:fixed;right:20px;bottom:20px;z-index:118;width:54px;height:54px;border-radius:99px;
  border:0;cursor:pointer;font-size:22px;color:#fff;
  background:linear-gradient(140deg,#818cf8,#6366f1);
  box-shadow:0 10px 28px rgba(99,102,241,.42);transition:.22s var(--ease)}
#aifab:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 16px 36px rgba(99,102,241,.55)}

.aipanel{position:fixed;right:0;top:0;bottom:0;width:440px;max-width:100vw;z-index:190;
  display:flex;flex-direction:column;transform:translateX(102%);transition:transform .28s var(--ease);
  background:var(--glass-2);backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border-left:1px solid var(--stroke-2);box-shadow:-16px 0 44px rgba(31,74,120,.16)}
.aipanel.on{transform:none}
.aihead{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--stroke-2)}
.aihead .dot{width:9px;height:9px;border-radius:99px;flex:0 0 9px;
  background:linear-gradient(140deg,#818cf8,#6366f1);box-shadow:0 0 10px rgba(99,102,241,.7)}
.aihead .t{flex:1;min-width:0}
.aihead .t b{display:block;font-size:14px;font-weight:800}
.aihead .t span{display:block;font-size:10px;color:var(--ink-3)}
.aihead .t span.ok{color:var(--pos)} .aihead .t span.warn{color:var(--warn)}
.aibody{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.aimsg{max-width:92%;padding:11px 14px;border-radius:16px;font-size:13px;line-height:1.6;
  white-space:pre-wrap;word-break:break-word}
.aimsg.user{align-self:flex-end;background:linear-gradient(140deg,#6366f1,#4f46e5);color:#fff;
  border-bottom-right-radius:5px}
.aimsg.assistant{align-self:flex-start;background:var(--field);border:1px solid var(--stroke-2);
  border-bottom-left-radius:5px}
.aimsg.note{align-self:stretch;max-width:100%;background:rgba(245,158,11,.10);
  border:1px solid rgba(245,158,11,.32);font-size:12px}
.aimsg code{font-family:var(--mono);font-size:11.5px;background:rgba(99,102,241,.12);
  padding:2px 6px;border-radius:6px;display:inline-block;margin:2px 0}
.aitool{align-self:flex-start;display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  font-size:10.5px;padding:5px 11px;border-radius:99px;
  background:rgba(99,102,241,.10);border:1px solid rgba(99,102,241,.26);color:var(--brand3)}
.aitool.write{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.32);color:#15803d}
.aitool.undone{opacity:.45;text-decoration:line-through}
.aitool b{font-family:var(--mono);font-size:10.5px}
.aitool span{color:var(--ink-3)}
.aitool span.err{color:var(--neg)}
.aitool .btn{padding:2px 8px;font-size:9.5px}
.aisug{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.aisug .btn{font-size:11px;padding:5px 11px}
.aifoot{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--stroke-2);align-items:flex-end}
#aiinput{flex:1;resize:none;border:1px solid var(--stroke-2);background:var(--field);color:var(--ink);
  border-radius:14px;padding:10px 13px;font-size:13px;font-family:inherit;outline:none;max-height:120px}
#aiinput:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(99,102,241,.16)}
@media(max-width:820px){
  .aipanel{width:100vw}
  #aifab{right:14px;bottom:14px;width:50px;height:50px}
}

@media print{#side,.topbar,.noprint,#aifab,.aipanel,#navtoggle{display:none!important}body::before,body::after{display:none}
  #app{display:block;height:auto}#main{padding:0}.view{overflow:visible}}

/* who is signed in — sits in the toolbar, next to the theme button */
.userchip{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 12px;border-radius:999px;

.userchip .ur{opacity:.65;font-size:11px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
@media (max-width:820px){.userchip .ur{display:none}}
